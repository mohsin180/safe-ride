spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${MESSAGING_DB_NAME:messaging_db}${DB_PARAMS:}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:kgf}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
server:
  port: ${MESSAGING_SERVER_PORT:8005}

# Base URLs for service-to-service calls (membership + name resolution).
rides:
  service:
    url: ${RIDES_SERVICE_URL:http://localhost:8003}
profile:
  service:
    url: ${PROFILE_SERVICE_URL:http://localhost:8002}
