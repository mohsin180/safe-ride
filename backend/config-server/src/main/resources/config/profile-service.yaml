spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PROFILE_DB_NAME:profile_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:kgf}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}   # options: validate, update, create, create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect
server:
  port: ${PROFILE_SERVER_PORT:8002}
