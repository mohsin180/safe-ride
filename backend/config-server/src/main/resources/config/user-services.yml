spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${USER_DB_NAME:user_db}${DB_PARAMS:}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:kgf}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}   # options: validate, update, create, create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:mughallmohsin938@gmail.com}
    password: ${MAIL_PASSWORD:urplbyykuhehsjsw}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  port: ${USER_SERVER_PORT:8001}
jwt:
  # Must match api-gateway's jwt.secret (the gateway validates tokens issued here).
  secret: ${JWT_SECRET:U2FmZVJpZGVTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb24yMDI2U3ByaW5nQm9vdA==}
  expiration: ${JWT_EXPIRATION:86400000}
app:
  verification:
    # Built into the email link the user clicks in their inbox. The real value
    # is set via APP_VERIFICATION_BASE_URL in backend/.env (which overrides
    # this default). Use localhost when opening emails on the dev machine, or
    # the Mac's LAN IP when opening on a phone — NOT 10.0.2.2 (that only
    # resolves inside the Android emulator).
    base-url: ${APP_VERIFICATION_BASE_URL:http://localhost:8080/api/v1/auth}
    token-expiry-hours: ${VERIFICATION_TOKEN_EXPIRY_HOURS:24}
  reset:
    # IMPORTANT: this must be the FRONTEND app's origin (where the Flutter
    # web build is served), NOT the API gateway. The reset email links to
    # "{base-url}/reset-password?token=..." which opens the app's reset
    # screen. Change this to your frontend host/port before testing.
    base-url: ${APP_RESET_BASE_URL:http://localhost:8080}
    token-expiry-hours: ${RESET_TOKEN_EXPIRY_HOURS:1}
