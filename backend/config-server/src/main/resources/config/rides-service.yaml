spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${RIDES_DB_NAME:ride_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:kgf}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
server:
  port: ${RIDES_SERVER_PORT:8003}

# Base URL of profile-service for service-to-service Feign calls
# (host / co-passenger name resolution). Matches profile-service's port.
profile:
  service:
    url: ${PROFILE_SERVICE_URL:http://localhost:8002}
