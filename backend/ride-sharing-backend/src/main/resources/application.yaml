# SafeRide monolith — the merged configuration of all former services.
# Every value is env-var-backed with a sensible local default, same pattern
# as before. Source backend/.env (load-env.sh / load-env.ps1) to override.
spring:
  application:
    name: saferide-monolith

  # Single database for the whole app (formerly user_db/profile_db/ride_db/
  # messaging_db/notification_db). Hibernate creates all tables here.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:saferide_db}${DB_PARAMS:}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # One app now, so the pool can be bigger than the old per-service 5.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}   # options: validate, update, create, create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Email verification + password reset (from user-services).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  # Same port the gateway used, so the Flutter app needs zero changes.
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

jwt:
  # Signing and validation now happen in the same app — no more manual
  # secret sync between user-services and api-gateway.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  verification:
    # Built into the email link the user clicks in their inbox. Use localhost
    # when opening emails on the dev machine, or the Mac's LAN IP / ngrok URL
    # when opening on a phone.
    base-url: ${APP_VERIFICATION_BASE_URL:http://localhost:8080/api/v1/auth}
    token-expiry-hours: ${VERIFICATION_TOKEN_EXPIRY_HOURS:24}
  reset:
    # The FRONTEND app's origin (where the Flutter web build is served),
    # NOT this backend.
    base-url: ${APP_RESET_BASE_URL:http://localhost:8080}
    token-expiry-hours: ${RESET_TOKEN_EXPIRY_HOURS:1}

# Fare-pricing model (server-authoritative), from rides-service.
pricing:
  base-fare: ${PRICE_BASE_FARE:50}
  per-km: ${PRICE_PER_KM:20}
  per-min: ${PRICE_PER_MIN:2}
  # Extra seats a rider holds cost 15% of their share each: the trip costs the
  # same to drive, but blocked seats stop anyone else joining.
  seat-surcharge-rate: ${PRICE_SEAT_SURCHARGE:0.15}
  premium-multiplier: ${PRICE_PREMIUM_MULTIPLIER:1.5}
  min-fare: ${PRICE_MIN_FARE:80}
  currency: ${PRICE_CURRENCY:PKR}

# Geoapify routing — road distance/time at ride creation. With no key,
# pricing falls back to Haversine.
geoapify:
  api-key: ${GEOAPIFY_KEY:}
  routing-url: ${GEOAPIFY_ROUTING_URL:https://api.geoapify.com/v1/routing}

# Didit identity verification (KYC: CNIC scan + liveness + face match).
# The workflow-id is per-session config, not a secret. IMPORTANT: workflow ids
# are per-ENVIRONMENT — a Sandbox key cannot use a Live workflow id (Didit
# answers "Invalid workflow_id."), so DIDIT_API_KEY and DIDIT_WORKFLOW_ID must
# always be changed together. The default below is the Sandbox "Free KYC"
# workflow; the Live one is 9ebecab1-a0b7-4002-aff7-a44da36bcd00.
didit:
  api-key: ${DIDIT_API_KEY:}
  base-url: ${DIDIT_BASE_URL:https://verification.didit.me}
  workflow-id: ${DIDIT_WORKFLOW_ID:2512b442-6d86-4a1c-829d-6cb77da3c8f1}
  # Compare the scanned document against the account (gender, CNIC number,
  # age, expiry). Always on for live documents; off in sandbox, because
  # sandbox returns one fixed synthetic document ("Gustavo Matsumoto",
  # Brazilian passport) that can never match a real CNIC and would reject
  # every user. Turn on to demonstrate the mismatch rejection in sandbox.
  enforce-document-match: ${DIDIT_ENFORCE_DOCUMENT_MATCH:false}
